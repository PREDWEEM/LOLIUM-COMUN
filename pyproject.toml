[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lolium-comun"
version = "1.14.4"
description = "Módulo común de las apps de Lolium multiflorum de PREDWEEM: alerta de flujos, visualización y acceso"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Todos los derechos reservados (ver COPYRIGHT.md)" }
authors = [{ name = "Guillermo R. Chantre / PREDWEEM" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy",
    "plotly",
    "streamlit",
    "XlsxWriter",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
